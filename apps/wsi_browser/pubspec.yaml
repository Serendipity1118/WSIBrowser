name: wsi_browser
description: "WSI Browser - a generic plugin host browser (Web System Injection for iOS / Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  app_links: ^7.0.0
  archive: ^4.2.0
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sdk/
