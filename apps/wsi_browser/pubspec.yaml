name: wsi_browser
description: "WSI Browser - a generic plugin host browser (Web System Injection for iOS / Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  android_id: ^0.5.2+1
  app_links: ^7.0.0
  archive: ^4.2.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sdk/

# App icon from assets/brand (render with `node tool/render_logo.mjs` after editing logo.svg),
# then `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo-1024.png
  adaptive_icon_background: "#2A56C6"
  adaptive_icon_foreground: assets/brand/logo-fg-1024.png
  remove_alpha_ios: true
  min_sdk_android: 26

flutter_native_splash:
  color: "#2A56C6"
  image: assets/brand/splash-icon-1024.png
  android_12:
    color: "#2A56C6"
    image: assets/brand/splash-icon-android12-1024.png
    icon_background_color: "#2A56C6"
  ios: true
  android: true
  fullscreen: false
