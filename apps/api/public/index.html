<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSI Browser plugins</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="card">
  <p class="eyebrow">WSI Browser</p>
  <h1>プラグイン配布</h1>
  <p>各プラグインの配布ページは <code>/p/&lt;plugin id&gt;</code> です。ページの QR を WSI Browser で読むとインポート画面が開きます。</p>
  <p class="hint">API: <code>GET /v1/plugins/:id/policy</code> / <code>GET /v1/plugins/:id/latest</code> / <code>POST /v1/feedback</code></p>
  <p class="alt"><a href="https://github.com/Serendipity1118/WSIBrowser">github.com/Serendipity1118/WSIBrowser</a></p>
</main>
</body>
</html>
