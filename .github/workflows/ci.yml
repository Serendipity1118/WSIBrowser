name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-no-firebase:
    name: Backend isolation check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Firebase / existing-app backend identifiers are referenced
        shell: pwsh
        run: ./tools/check_no_firebase.ps1

  sdk-and-tools:
    name: SDK core + plugin CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build SDK bundles
        run: npm run build:sdk
      - name: Plugin CLI tests
        run: npm run test:tools
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/wsi_sdk
      - name: Check out WebSystemInjection (Chrome extension) next to this repo
        uses: actions/checkout@v4
        with:
          repository: Serendipity1118/WebSystemInjection
          path: ../WebSystemInjection
      - name: Sync the generated SDK bundle into the extension checkout
        run: npm run sync:wsi -w packages/wsi_sdk
      - name: SDK contract tests (mock adapter + Chrome extension with the 7 samples)
        run: xvfb-run --auto-servernum npx playwright test
        working-directory: packages/wsi_sdk

  api:
    name: Backend (Workers + D1 + R2 on workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api

  flutter:
    name: Flutter host (analyze + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/wsi_browser
      - run: flutter gen-l10n
        working-directory: apps/wsi_browser
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/wsi_browser
      - run: flutter analyze
        working-directory: apps/wsi_browser
      - run: flutter test
        working-directory: apps/wsi_browser
      # integration_test/samples_test.dart needs an Android emulator: see codemagic.yaml (android-integration)
