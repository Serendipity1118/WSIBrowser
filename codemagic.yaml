# Codemagic workflows for WSI Browser (apps/wsi_browser).
#
# iOS cannot be built on the Windows development machine, so every iOS build
# runs here. The Flutter version is pinned to the one used on the development
# machine; bump it only after verifying locally.
#
#   ios-unsigned    : unsigned .ipa for smoke checks (no signing needed)
#   ios-appstore    : signed build uploaded to TestFlight (App Store Connect
#                     integration "Codemagic", automatic signing for
#                     jp.serendipy.wsibrowser)
#   android-debug   : debug APK for sideloading on test devices
#   android-release : signed AAB + APK (upload key wsibrowser_upload, Play internal track)
definitions:
  env_versions: &env_versions
    flutter: 3.41.4
    xcode: latest
    cocoapods: default
  scripts:
    - &pub_get
      name: Flutter pub get
      script: |
        cd apps/wsi_browser
        flutter pub get
    - &gen
      name: Generate localizations and drift code
      script: |
        cd apps/wsi_browser
        flutter gen-l10n
        dart run build_runner build --delete-conflicting-outputs
    - &test
      name: Flutter unit tests
      script: |
        cd apps/wsi_browser
        flutter test

workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
    scripts:
      - *pub_get
      - *gen
      - *test
      - name: Install CocoaPods
        script: |
          cd apps/wsi_browser/ios && pod install
      - name: Build unsigned iOS app
        script: |
          cd apps/wsi_browser
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          cd apps/wsi_browser/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r /tmp/WSIBrowser-unsigned.ipa Payload/
    artifacts:
      - /tmp/WSIBrowser-unsigned.ipa

  ios-appstore:
    name: iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.serendipy.wsibrowser
      vars:
        APP_ID: jp.serendipy.wsibrowser
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          cd apps/wsi_browser
          xcode-project use-profiles
      - *pub_get
      - *gen
      - *test
      - name: Install pods
        script: |
          cd apps/wsi_browser/ios && pod install --repo-update
      - name: Flutter build ipa
        script: |
          cd apps/wsi_browser
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - apps/wsi_browser/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: 3.41.4
      java: 17
    scripts:
      - *pub_get
      - *gen
      - *test
      - name: Build debug APK
        script: |
          cd apps/wsi_browser
          flutter build apk --debug
    artifacts:
      - apps/wsi_browser/build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android Release (AAB + APK)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.41.4
      java: 17
      groups:
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      android_signing:
        - wsibrowser_upload
      vars:
        PACKAGE_NAME: jp.serendipy.wsibrowser
    scripts:
      - name: Set up key.properties
        script: |
          cat > apps/wsi_browser/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - *pub_get
      - *gen
      - *test
      - name: Determine build number
        script: |
          # The first build runs before the app exists on Google Play, so fall back to 0.
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS 2>/dev/null || true)
          case "$LATEST" in
            ''|*[!0-9]*) LATEST=0 ;;
          esac
          echo "BUILD_NUMBER=$((LATEST + 1))" >> "$CM_ENV"
      - name: Install the Android SDK platform for compileSdk
        script: |
          # The Linux image does not ship platform 37. If Gradle downloads it itself the
          # run still fails with "Failed to find target with hash string 'android-37'",
          # because the platform arrives after the SDK index has been read. Installing it
          # up front avoids that. sdkmanager is not on PATH, and cmdline-tools is not
          # always under "latest", so look the binary up.
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "y" | "$SDKMANAGER" --install "platforms;android-37" \
            || echo "y" | "$SDKMANAGER" --install "platforms;android-37.0"
          ls "$SDK_ROOT/platforms"
      - name: Build AAB and APK
        script: |
          set -e
          cd apps/wsi_browser
          flutter build appbundle --release --build-number=$BUILD_NUMBER
          flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - apps/wsi_browser/build/app/outputs/bundle/release/*.aab
      - apps/wsi_browser/build/app/outputs/flutter-apk/*.apk
      - apps/wsi_browser/build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # M1 / M2 integration test on an Android emulator (unverified on Codemagic; runs locally with
  # `flutter test integration_test/samples_test.dart -d emulator-5554`). Trigger manually.
  android-integration:
    name: Android Integration Test (emulator)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.41.4
      java: 17
    scripts:
      - *pub_get
      - *gen
      - name: Start an emulator
        script: |
          cd $HOME/programs/android-sdk-macosx 2>/dev/null || true
          sdkmanager --install "system-images;android-34;google_apis;x86_64" || true
          echo no | avdmanager create avd -n wsi -k "system-images;android-34;google_apis;x86_64" --force
          $ANDROID_SDK_ROOT/emulator/emulator -avd wsi -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
      - name: Integration test
        script: |
          cd apps/wsi_browser
          flutter test integration_test/samples_test.dart -d emulator-5554

