<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruise results</title>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; color: #222; }
main { padding: 16px 20px 32px; }
h1 { font-size: 18px; margin: 0 0 12px; }
ol { padding-left: 20px; } li { margin: 6px 0; word-break: break-all; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
button { flex: 1; min-height: 44px; border: none; border-radius: 999px; background: #4688f1; color: #fff; font-size: 15px; }
.status { color: #666; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>巡回結果</h1>
  <p id="status" class="status"></p>
  <ol id="list"></ol>
  <p class="actions">
    <button id="start" type="button">巡回を開始</button>
    <button id="refresh" type="button">更新</button>
  </p>
</main>
<script src="results.js"></script>
</body>
</html>
