<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner Demo settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1>バナー設定</h1>
  <label>文言 <input id="text" type="text" maxlength="80"></label>
  <label>色
    <select id="color">
      <option value="blue">blue</option>
      <option value="green">green</option>
      <option value="orange">orange</option>
    </select>
  </label>
  <label class="row"><input id="visible" type="checkbox"> 表示する</label>
  <p class="actions">
    <button id="ping" type="button">ページに ping</button>
    <button id="close" type="button">閉じる</button>
  </p>
  <p id="status" class="status"></p>
</main>
<script src="settings.js"></script>
</body>
</html>
